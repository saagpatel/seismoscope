name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test Swift package
        run: swift test --package-path SeismoscopeKit

      - name: Test iOS app
        run: |
          xcodebuild test \
            -scheme Seismoscope \
            -project Seismoscope.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath "$RUNNER_TEMP/SeismoscopeDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build
        run: |
          xcodebuild build \
            -scheme Seismoscope \
            -project Seismoscope.xcodeproj \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SeismoscopeDerivedData" \
            CODE_SIGNING_ALLOWED=NO
